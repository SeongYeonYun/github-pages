<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Soap Game — With Bubbles</title>

  <style>
    /* == soap_game.css (embedded) == */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; -webkit-font-smoothing:antialiased; }
    body { font-family: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", Roboto; color:#052b2f; background: linear-gradient(150deg,#cfeffd 0%,#8fd8f4 18%,#6fbff5 55%,#4095f5 100%); }

    #game-root { position: relative; width:100%; height:100vh; overflow:hidden; display:flex; flex-direction:column; z-index:0; }
    #header-area { position:relative; width:100%; height:64px; padding:8px 12px; display:flex; align-items:center; gap:12px; }

    #pauseBtn { position:absolute; right:12px; top:12px; width:38px; height:38px; background:transparent; border:0; cursor:pointer; z-index:1000; }
    #pauseBtn img{ width:100%; height:100%; display:block; }

    #timer { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:min(420px,80%); height:22px; border-radius:24px; padding:3px; background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(0,0,0,0.03)); box-shadow: inset 0 2px 6px rgba(0,0,0,0.18); z-index:200; }
    #timer .fill{ position:absolute; top:0; left:0; width:28%; height:100%; border-radius:20px; background:#00bcd4; transition: width .3s ease-out; }

    #game-board { position:relative; width:100%; flex:1 1 auto; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; padding:0; }

    /* scene image styling */
    #scene-img { width:100%; height:60%; object-fit:cover; user-select:none; z-index:5; margin-bottom:60%; display:block; }

    /* soap item */
    #soup_item{ position:absolute; width:48px; z-index:60; touch-action:none; user-select:none; -webkit-user-drag:none; transform:translate(-50%,-50%) rotate(0deg); transition: transform 140ms linear; will-change:left,top,transform; pointer-events:none; }

    /* bubble layer and bubble style */
    #bubble-layer{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:55; }
    .bubble{ position:absolute; transform:translate(-50%,-50%); border-radius:50%; background:rgba(255,255,255,0.92); box-shadow:0 2px 8px rgba(0,0,0,0.12); pointer-events:none; }

    /* bubble animation: float up and fade + slight scale */
    @keyframes bubbleRise {
      0% { transform: translate(-50%,-50%) translateY(0) scale(0.9); opacity:0.95; }
      30% { transform: translate(-50%,-80%) scale(1.05); opacity:0.95; }
      100%{ transform: translate(-50%,-140%) scale(1.15); opacity:0; }
    }

    /* DPAD */
    #direction-buttons{ position:absolute; right:18px; bottom:18px; width:180px; height:180px; z-index:260; }
    #direction-buttons img{ width:100%; height:100%; display:block; pointer-events:none; }
    #direction-buttons button{ position:absolute; left:0; top:0; width:100%; height:100%; background:transparent; border:0; padding:0; margin:0; z-index:270; cursor:pointer; opacity:0; }
    #up-btn{ clip-path: polygon(50% 50%, 0% 0%, 100% 0%); }
    #right-btn{ clip-path: polygon(50% 50%, 100% 0%, 100% 100%); }
    #down-btn{ clip-path: polygon(50% 50%, 100% 100%, 0% 100%); }
    #left-btn{ clip-path: polygon(50% 50%, 0% 100%, 0% 0%); }

    .hud{ position:absolute; left:14px; top:14px; z-index:300; background: rgba(255,255,255,0.85); padding:6px 8px; border-radius:8px; font-weight:600; font-size:13px; display:none; }

    /* modal */
    .modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none; z-index:1000; }
    .modal.visible{ display:flex; pointer-events:auto; background: rgba(0,0,0,0.4); }
    .modal .modal-content{ width:min(540px,92%); padding:18px; background:#fff; border-radius:10px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
    .close-btn{ position:absolute; right:12px; top:8px; border:0; background:none; font-size:20px; cursor:pointer; }
    .btn{ border:0; padding:10px 14px; border-radius:8px; cursor:pointer; }
    .btn.primary{ background:#0ea5c8; color:#fff; }
    .btn.warn{ background:#ef4444; color:#fff; }

    @media (max-width:420px){ #direction-buttons{ width:140px; height:140px; right:12px; bottom:12px; } #soup_item{ width:40px; } }
  </style>
</head>
<body>
  <div id="game-root" role="main" aria-label="Soap Game Root">
    <div id="header-area">
      <div id="timer" role="timer" aria-live="polite"><div class="fill"><div class="wave wave1"></div></div></div>
      <button id="pauseBtn" aria-label="일시정지" title="일시정지"><img src="../asset/img/StopB.png" alt="pause"></button>
    </div>

    <div id="game-board" role="game-board" aria-label="Game Board">
      <div id="hud" class="hud" aria-hidden="true">node: -, -</div>

      <img id="soup_item" src="../asset/img/Comp_2_0000000.png" alt="soap item">
      <img id="scene-img" src="../asset/img/BathROOM_0000527.jpg" alt="Scene background">

      <!-- bubble layer: bubbles are added/removed here -->
      <div id="bubble-layer" aria-hidden="true"></div>

      <div id="direction-buttons" role="group" aria-label="directional pad">
        <img id="dpad-img" src="../asset/img/BAD.png" alt="Directional Pad">
        <button id="up-btn" data-dir="UP" aria-label="위"></button>
        <button id="right-btn" data-dir="RIGHT" aria-label="오른쪽"></button>
        <button id="down-btn" data-dir="DOWN" aria-label="아래"></button>
        <button id="left-btn" data-dir="LEFT" aria-label="왼쪽"></button>
      </div>
    </div>
  </div>

  <!-- Pause Modal -->
  <div id="pauseModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content" role="document">
      <button class="close-btn" id="pauseClose" aria-label="닫기">&times;</button>
      <h2 style="text-align:center;margin:6px 0 14px 0;">일시정지</h2>
      <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
        <button id="resumeBtn" class="btn primary">계속하기</button>
        <button id="restartBtn" class="btn">재시작</button>
        <button id="quitBtn" class="btn warn">나가기</button>
      </div>
    </div>
  </div>

  <!-- GameOver Modal -->
  <div id="gameOverModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content" role="document">
      <button class="close-btn" id="goClose" aria-label="닫기">&times;</button>
      <h2 style="text-align:center;margin:6px 0 10px 0;">게임 오버</h2>
      <p id="gameOverMsg" style="text-align:center; margin:8px 0 12px 0;">허용 영역을 벗어났습니다.</p>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button id="goRestart" class="btn primary">다시시작</button>
        <button id="goExit" class="btn warn">나가기</button>
      </div>
    </div>
  </div>

  <!-- 핵심 스크립트: board-local 기준 그리드 + 중심 보정 + 입력/루프 + bubbles -->
  <script>
  document.addEventListener('DOMContentLoaded', function(){
    // 설정
    const TILES_X = 4, TILES_Y = 4;
    const SPEED = 160; // px/s
    const EPS = 0.6;   // 도달 허용 오차

    // 플레이어블 박스(원본 이미지 정규화 좌표) - 필요시 조정
    const PLAYABLE_BOX = { left:0.17, top:0.14, right:0.83, bottom:0.86 };

    // 이미지 중심 보정 (픽셀). 기본 0, 조정 필요 시 콘솔에서 setSoapOffset(x,y) 호출
    let soapOffset = { x:0, y:0 };

    // bubble params (조절 가능)
    let bubbleParams = {
      enabled: true,
      interval: 120,      // ms between bubbles while moving
      minSize: 6,         // px
      maxSize: 18,        // px
      lifeMin: 700,       // ms (animation duration)
      lifeMax: 1300
    };

    const board = document.getElementById('game-board');
    const soup = document.getElementById('soup_item');
    const sceneImg = document.getElementById('scene-img');
    const hud = document.getElementById('hud');
    const bubbleLayer = document.getElementById('bubble-layer');
    const dpadImg = document.getElementById('dpad-img');
    const dpadContainer = document.getElementById('direction-buttons');

    const pauseBtn = document.getElementById('pauseBtn');
    const pauseModal = document.getElementById('pauseModal');
    const pauseClose = document.getElementById('pauseClose');
    const resumeBtn = document.getElementById('resumeBtn');
    const restartBtn = document.getElementById('restartBtn');
    const quitBtn = document.getElementById('quitBtn');

    const gameOverModal = document.getElementById('gameOverModal');
    const goClose = document.getElementById('goClose');
    const goRestart = document.getElementById('goRestart');
    const goExit = document.getElementById('goExit');
    const gameOverMsg = document.getElementById('gameOverMsg');

    if(!board || !soup || !sceneImg){ console.error('필수 요소 없음'); return; }

    // 상태
    let node = { i: Math.floor(TILES_X/2), j: Math.floor(TILES_Y/2) };
    let dir = { x:1, y:0 };
    let queuedDir = null;
    let moving = true;
    let lastTs = null;
    let lastBubbleTs = 0;
    let gameOver = false;

    // 그리드 라인 좌표 (board-local px)
    let pixelNodesX = new Array(TILES_X+1).fill(0);
    let pixelNodesY = new Array(TILES_Y+1).fill(0);

    // debug nodes 표시 (콘솔에서 toggle 가능)
    let debugNodes = false;
    let debugContainer = null;
    function renderDebug(){
      if(!debugNodes){ if(debugContainer){ debugContainer.remove(); debugContainer=null; } return; }
      if(!debugContainer){ debugContainer = document.createElement('div'); debugContainer.style.position='absolute'; debugContainer.style.left='0'; debugContainer.style.top='0'; debugContainer.style.width='100%'; debugContainer.style.height='100%'; debugContainer.style.pointerEvents='none'; debugContainer.style.zIndex=9999; board.appendChild(debugContainer); }
      debugContainer.innerHTML='';
      for(let i=0;i<=TILES_X;i++){
        for(let j=0;j<=TILES_Y;j++){
          const x = pixelNodesX[i]; const y = pixelNodesY[j];
          const dot = document.createElement('div');
          dot.style.position='absolute'; dot.style.left=(x-3)+'px'; dot.style.top=(y-3)+'px'; dot.style.width='6px'; dot.style.height='6px'; dot.style.borderRadius='50%'; dot.style.background='rgba(255,0,0,0.95)'; dot.style.boxShadow='0 0 6px rgba(0,0,0,0.2)'; debugContainer.appendChild(dot);
        }
      }
    }

    // board-local 그리드 계산: 모든 내부 좌표는 board-local 기준
    function computeGridBoardLocal(){
      const boardRect = board.getBoundingClientRect();
      const imgRect = sceneImg.getBoundingClientRect();
      const naturalW = sceneImg.naturalWidth || imgRect.width;
      const naturalH = sceneImg.naturalHeight || imgRect.height;
      const displayW = imgRect.width; const displayH = imgRect.height;
      const scale = Math.max(displayW / naturalW, displayH / naturalH);
      const renderedW = naturalW * scale; const renderedH = naturalH * scale;
      const extraX = renderedW - displayW; const extraY = renderedH - displayH;
      const imgLeftWindow = imgRect.left - (extraX/2);
      const imgTopWindow  = imgRect.top  - (extraY/2);

      const boxLeftWin = imgLeftWindow + PLAYABLE_BOX.left * renderedW;
      const boxRightWin = imgLeftWindow + PLAYABLE_BOX.right * renderedW;
      const boxTopWin = imgTopWindow + PLAYABLE_BOX.top * renderedH;
      const boxBottomWin = imgTopWindow + PLAYABLE_BOX.bottom * renderedH;

      const leftLocal = boxLeftWin - boardRect.left;
      const rightLocal = boxRightWin - boardRect.left;
      const topLocal = boxTopWin - boardRect.top;
      const bottomLocal = boxBottomWin - boardRect.top;

      const tileW = (rightLocal - leftLocal) / TILES_X;
      const tileH = (bottomLocal - topLocal) / TILES_Y;

      for(let i=0;i<=TILES_X;i++) pixelNodesX[i] = leftLocal + i*tileW;
      for(let j=0;j<=TILES_Y;j++) pixelNodesY[j] = topLocal + j*tileH;

      if(hud){ hud.style.display='block'; hud.textContent = `node:${node.i},${node.j} tile:${tileW.toFixed(1)}x${tileH.toFixed(1)}px`; }
      renderDebug();
    }

    function nodeToBoardLocal(i,j){ const ii = Math.max(0,Math.min(TILES_X,i)); const jj = Math.max(0,Math.min(TILES_Y,j)); return { x: pixelNodesX[ii], y: pixelNodesY[jj] }; }

    function placeAtNodeBoardLocal(i,j){ const p = nodeToBoardLocal(i,j); const cx = p.x + soapOffset.x; const cy = p.y + soapOffset.y; soup.style.left = cx.toFixed(2) + 'px'; soup.style.top = cy.toFixed(2) + 'px'; }

    function getCenterBoardLocal(){ const s = soup.getBoundingClientRect(); const b = board.getBoundingClientRect(); const cx = (s.left + s.right)/2 - b.left; const cy = (s.top + s.bottom)/2 - b.top; return { x: cx, y: cy }; }

    function applyDirection(dx,dy){ if(gameOver) return; if(Math.abs(dx)+Math.abs(dy)!==1) return; dir.x = dx; dir.y = dy; queuedDir = null; const angle = Math.atan2(dy,dx) * 180/Math.PI; soup.style.transform = `translate(-50%,-50%) rotate(${angle}deg)`; }

    window.changeDirection = function(dx,dy){ if(gameOver) return; if(typeof dx!=='number' || typeof dy!=='number') return; if(dx===0 && dy===0) return; const cur = getCenterBoardLocal(); const center = nodeToBoardLocal(node.i,node.j); const dist = Math.hypot(cur.x-center.x, cur.y-center.y); if(dist <= EPS + 0.01){ const ni = node.i + dx, nj = node.j + dy; if(ni < 0 || ni > TILES_X || nj < 0 || nj > TILES_Y){ triggerGameOver('벽에 부딪혔습니다.'); return; } applyDirection(dx,dy); } else { queuedDir = { x:dx, y:dy }; } };

    function triggerGameOver(msg){ gameOver = true; moving = false; if(gameOverMsg) gameOverMsg.textContent = msg||'게임 오버'; if(gameOverModal){ gameOverModal.classList.add('visible'); gameOverModal.setAttribute('aria-hidden','false'); } }

    // bubble spawn helper
    function rand(min,max){ return Math.random()*(max-min)+min; }
    function spawnBubbleAt(boardX, boardY){ if(!bubbleParams.enabled) return; const size = Math.round(rand(bubbleParams.minSize, bubbleParams.maxSize)); const life = Math.round(rand(bubbleParams.lifeMin, bubbleParams.lifeMax)); const el = document.createElement('div'); el.className = 'bubble'; el.style.width = size + 'px'; el.style.height = size + 'px'; el.style.left = boardX + 'px'; el.style.top = boardY + 'px'; el.style.opacity = '0.98'; el.style.animation = `bubbleRise ${life}ms cubic-bezier(.2,.9,.2,1) forwards`; bubbleLayer.appendChild(el); // cleanup
      el.addEventListener('animationend', ()=>{ try{ el.remove(); }catch(e){} }); }

    function maybeSpawnBubble(ts){ if(!bubbleParams.enabled) return; if(!moving) return; if(!lastBubbleTs) lastBubbleTs = ts; if(ts - lastBubbleTs >= bubbleParams.interval){ const c = getCenterBoardLocal(); spawnBubbleAt(c.x, c.y); lastBubbleTs = ts; } }

    function loop(ts){ if(gameOver) return; if(!lastTs) lastTs = ts; const dt = (ts - lastTs)/1000; lastTs = ts; computeGridBoardLocal(); if(moving){ const nextI = node.i + dir.x; const nextJ = node.j + dir.y; if(nextI < 0 || nextI > TILES_X || nextJ < 0 || nextJ > TILES_Y){ triggerGameOver('벽에 부딪혔습니다.'); return; } const target = nodeToBoardLocal(nextI,nextJ); const cur = getCenterBoardLocal(); const vx = target.x - cur.x; const vy = target.y - cur.y; const dist = Math.hypot(vx,vy); if(dist <= EPS){ node.i = nextI; node.j = nextJ; placeAtNodeBoardLocal(node.i,node.j); if(queuedDir){ const ci = node.i + queuedDir.x, cj = node.j + queuedDir.y; if(ci < 0 || ci > TILES_X || cj < 0 || cj > TILES_Y){ triggerGameOver('벽에 부딪힙니다.'); return; } applyDirection(queuedDir.x, queuedDir.y); } } else { const move = Math.min(SPEED * dt, dist); const nx = cur.x + (vx/dist)*move; const ny = cur.y + (vy/dist)*move; soup.style.left = nx.toFixed(2) + 'px'; soup.style.top = ny.toFixed(2) + 'px'; } maybeSpawnBubble(ts); } requestAnimationFrame(loop); }

    // 입력 wiring (dpad + keyboard)
    const dirMap = { 'UP':{dx:0,dy:-1,ch:'U'}, 'RIGHT':{dx:1,dy:0,ch:'R'}, 'DOWN':{dx:0,dy:1,ch:'D'}, 'LEFT':{dx:-1,dy:0,ch:'L'} };
    function setPressedImage(key){ if(dpadImg && dirMap[key]) dpadImg.src = `../asset/img/B${dirMap[key].ch}P.png`; }
    function restoreDefaultImage(){ if(dpadImg) dpadImg.src = '../asset/img/BAD.png'; }

    ['up','right','down','left'].forEach(id=>{ const btn = document.getElementById(id+'-btn'); const key = id.toUpperCase(); if(!btn) return; btn.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); try{ btn.setPointerCapture(e.pointerId); }catch(_){} setPressedImage(key); const info = dirMap[key]; if(info) window.changeDirection(info.dx, info.dy); }, { passive:false }); const upHandler = e=>{ try{ btn.releasePointerCapture && btn.releasePointerCapture(e && e.pointerId); }catch(_){} restoreDefaultImage(); }; btn.addEventListener('pointerup', upHandler, { passive:false }); btn.addEventListener('pointercancel', upHandler, { passive:false }); btn.addEventListener('pointerleave', upHandler); btn.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); const info = dirMap[key]; if(info) window.changeDirection(info.dx, info.dy); setPressedImage(key); setTimeout(restoreDefaultImage,120); }, { passive:false }); });

    dpadContainer.addEventListener('pointerdown', function(e){ try{ e.preventDefault(); e.stopPropagation(); }catch(_){} const rect = dpadContainer.getBoundingClientRect(); const cx = rect.left + rect.width/2; const cy = rect.top + rect.height/2; const dx = e.clientX - cx; const dy = e.clientY - cy; const ang = Math.atan2(dy,dx) * 180/Math.PI; let key = 'RIGHT'; if(ang >= -45 && ang < 45) key='RIGHT'; else if(ang >=45 && ang <135) key='DOWN'; else if(ang >= -135 && ang < -45) key='UP'; else key='LEFT'; setPressedImage(key); const info = dirMap[key]; if(info) window.changeDirection(info.dx, info.dy); setTimeout(restoreDefaultImage,120); }, { passive:false });

    window.addEventListener('keydown', function(e){ if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return; e.preventDefault(); const mapKey = { ArrowUp:'UP', ArrowRight:'RIGHT', ArrowDown:'DOWN', ArrowLeft:'LEFT' }[e.key]; setPressedImage(mapKey); setTimeout(restoreDefaultImage,120); const info = dirMap[mapKey]; if(info) window.changeDirection(info.dx, info.dy); }, { passive:false });

    // modal wiring
    if(pauseBtn) pauseBtn.addEventListener('click', e=>{ e.preventDefault(); if(pauseModal){ pauseModal.classList.add('visible'); pauseModal.setAttribute('aria-hidden','false'); } moving=false; });
    if(pauseClose) pauseClose.addEventListener('click', e=>{ e.preventDefault(); if(pauseModal){ pauseModal.classList.remove('visible'); pauseModal.setAttribute('aria-hidden','true'); } moving=true; requestAnimationFrame(loop); });
    if(resumeBtn) resumeBtn.addEventListener('click', e=>{ e.preventDefault(); if(pauseModal){ pauseModal.classList.remove('visible'); pauseModal.setAttribute('aria-hidden','true'); } moving=true; requestAnimationFrame(loop); });
    if(restartBtn) restartBtn.addEventListener('click', e=>{ e.preventDefault(); location.reload(); });
    if(quitBtn) quitBtn.addEventListener('click', e=>{ e.preventDefault(); window.location.href = '/'; });

    if(pauseModal) pauseModal.addEventListener('click', e=>{ if(e.target===pauseModal){ pauseModal.classList.remove('visible'); pauseModal.setAttribute('aria-hidden','true'); moving=true; requestAnimationFrame(loop); } });
    if(gameOverModal) gameOverModal.addEventListener('click', e=>{ if(e.target===gameOverModal){ gameOverModal.classList.remove('visible'); gameOverModal.setAttribute('aria-hidden','true'); } });
    if(goClose) goClose.addEventListener('click', e=>{ e.preventDefault(); if(gameOverModal){ gameOverModal.classList.remove('visible'); gameOverModal.setAttribute('aria-hidden','true'); } });
    if(goRestart) goRestart.addEventListener('click', e=>{ e.preventDefault(); location.reload(); });
    if(goExit) goExit.addEventListener('click', e=>{ e.preventDefault(); window.location.href = '/'; });

    document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(pauseModal && pauseModal.classList.contains('visible')){ pauseModal.classList.remove('visible'); pauseModal.setAttribute('aria-hidden','true'); moving=true; requestAnimationFrame(loop); } if(gameOverModal && gameOverModal.classList.contains('visible')){ gameOverModal.classList.remove('visible'); gameOverModal.setAttribute('aria-hidden','true'); } } });

    // public helpers for debugging and bubble adjustments
    window.__soap = window.__soap || {};
    Object.assign(window.__soap, {
      computeGrid: computeGridBoardLocal,
      placeAt: placeAtNodeBoardLocal,
      getState: ()=>({ node, dir, queuedDir, gameOver, pixelNodesX, pixelNodesY, soapOffset, bubbleParams }),
      setSoapOffset: (x,y)=>{ soapOffset.x = x; soapOffset.y = y; placeAtNodeBoardLocal(node.i,node.j); },
      toggleDebugNodes: (on)=>{ debugNodes = !!on; renderDebug(); },
      setBubbleParams: (opts)=>{ Object.assign(bubbleParams, opts); },
      toggleBubbles: (on)=>{ bubbleParams.enabled = !!on; }
    });

    // start after image loaded (or timeout)
    function start(){ computeGridBoardLocal(); node.i = Math.floor(TILES_X/2); node.j = Math.floor(TILES_Y/2); placeAtNodeBoardLocal(node.i,node.j); moving=true; lastTs=null; lastBubbleTs=0; gameOver=false; requestAnimationFrame(loop); }
    if(sceneImg.complete) start(); else { sceneImg.addEventListener('load', start, { once:true }); setTimeout(()=>{ if(!sceneImg.complete) start(); },300); }
    window.addEventListener('resize', ()=>{ computeGridBoardLocal(); placeAtNodeBoardLocal(node.i,node.j); });

  });
  </script>
</body>
</html>

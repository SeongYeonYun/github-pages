<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Soap Game - Integrated (separate files)</title>
    <link rel="stylesheet" href="../asset/css/soap_game.css">
    
    </head>
<body>
    <div id="game-root" role="main" aria-label="Soap Game Root">

        <div id="header-area">
            <div id="timer" role="timer" aria-live="polite">
                <div class="fill" style="width:28%;">
                    <div class="wave wave1"></div>
                </div>
            </div>

		<button id="pauseBtn" aria-label="일시정지" title="일시정지" class="icon-btn">
			<img src="../asset/img/StopB.png" alt="" aria-hidden="true" class="icon-img">
		</button>
        </div>

        <div id="game-board" role="game-board" aria-label="Game Board">
            <img id="scene-img" src="../asset/img/BathROOM_0000527.jpg" alt="Scene background"
                 style="width:100%; height:60%; object-fit:cover; z-index:5; user-select:none; margin-bottom : 60%"/>
            
            <div id="direction-buttons">
                <img id="dpad-img" src="../asset/img/BAD.png" alt="Directional Pad" />
                
                <button id="up-btn" data-direction="UP"></button>
                <button id="down-btn" data-direction="DOWN"></button>
                <button id="left-btn" data-direction="LEFT"></button>
                <button id="right-btn" data-direction="RIGHT"></button>
            </div>
        
        </div>

        <div id="myModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" style="display:none;">
            <div class="modal-content" role="document" style="width:min(520px,92%); padding:18px;"> 
                <button class="close" id="closeBtn" aria-label="모달 닫기" style="position:absolute; right:12px; top:8px;">&times;</button>
                <h2 style="text-align:center;">일시정지</h2>
                <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
                    <button class="restart" style="background:#0ea5c8; color:white; width:80%; height:44px; border-radius:12px;">재시작</button>
                    <button class="exit" style="background:#ef4444; color:white; width:80%; height:44px; border-radius:12px;">나가기</button>
                </div>
            </div>
        </div>

    </div>

    <script src="../asset/js/soap_utils_shim.js" defer></script>
    <script src="../asset/js/soap_utils_patched.js" defer></script>
    <script src="../asset/js/soap_obstacles.js" defer></script>
    <script src="../asset/js/soap_game_core.js" defer></script>
    <script src="../asset/js/soap_timer.js" defer></script>

    <script defer>
        (function(){
            var pauseBtn = document.getElementById('pauseBtn');
            var modal = document.getElementById('myModal');
            var closeBtn = document.getElementById('closeBtn');
            
            // ⭐ 기존 모달 로직 유지 ⭐
            function setPaused(p){ 
                if(!modal) return; 
                if(p){ 
                    modal.setAttribute('aria-hidden','false'); 
                    modal.style.display='flex'; 
                } else { 
                    modal.setAttribute('aria-hidden','true'); 
                    modal.style.display='none'; 
                } 
            }
            
            if(pauseBtn) pauseBtn.addEventListener('click', function(e){ e.preventDefault(); setPaused(true); });
            if(closeBtn) closeBtn.addEventListener('click', function(e){ e.preventDefault(); setPaused(false); });
            if(modal) modal.addEventListener('click', function(e){ if(e.target === modal) setPaused(false); });
            document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && modal && modal.getAttribute('aria-hidden')==='false'){ setPaused(false); } });
            
            
            // =========================================================
            // ⭐ JavaScript 기반의 안정적인 이미지 교체 및 클릭 로직 ⭐
            // =========================================================

            const dpadButtons = document.querySelectorAll('#direction-buttons button');
            const dpadImg = document.getElementById('dpad-img');
            const defaultSrc = '../asset/img/BAD.png'; // 기본 이미지 경로

            dpadButtons.forEach(button => {
                const direction = button.dataset.direction;
                // 예: UP -> BUP.png, LEFT -> BLP.png
                const pressedSrc = `../asset/img/B${direction[0]}P.png`; 

                // 1. 마우스를 누르거나 (mousedown) 터치하기 시작했을 때 (touchstart)
                button.addEventListener('mousedown', (e) => {
                    if (e.button === 0) dpadImg.src = pressedSrc; // 마우스 왼쪽 버튼일 때만
                });
                button.addEventListener('touchstart', (e) => {
                    e.preventDefault(); 
                    dpadImg.src = pressedSrc;
                });

                // 2. 마우스를 떼거나 (mouseup) 영역을 벗어났을 때 (mouseleave)
                const restoreDefault = () => {
                    // 현재 이미지가 눌린 상태 이미지인 경우에만 기본 이미지로 복귀
                    if (dpadImg.src.includes(pressedSrc.slice(-7))) {
                        dpadImg.src = defaultSrc;
                    }
                };

                button.addEventListener('mouseup', restoreDefault);
                button.addEventListener('mouseleave', restoreDefault);
                button.addEventListener('touchend', restoreDefault);
                
                // 3. 최종 클릭 이벤트 (게임 로직 실행 지점)
                button.addEventListener('click', () => {
                    // console.log(`[JS 클릭 확인] ${direction} 방향키가 클릭되었습니다. (게임 로직 실행)`);
                    // ⭐ 여기에 장면 전환, 아이템 획득 등의 로직을 추가하세요. ⭐
                });
            });
        })();
    </script>

</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Soap Game — Fixed (images/videos visible)</title>
  <link rel="stylesheet" href="../asset/css/soap_game.css">
  <style>
    /* Small additions for soup spawn/drop and dust */
    #soup_item { transform-origin:center center; transition: transform 180ms ease-out; }
    .soup_spawn {
      animation: soupDrop 420ms cubic-bezier(.2,.9,.2,1) forwards;
    }
    @keyframes soupDrop {
      0% { transform: translate(-50%,-50%) scale(1.6); opacity:0; filter:blur(6px); }
      60% { transform: translate(-50%,-40%) scale(1.0); opacity:1; filter:blur(0); }
      100% { transform: translate(-50%,-50%) scale(1.0); opacity:1; }
    }
    .dust{ pointer-events:none; position:absolute; border-radius:50%; }
    .board-apng, .board-video { transition: opacity 160ms ease-out; opacity:0; }
    .board-apng.shown, .board-video.shown { opacity:1; }
  </style>
</head>
<body>
  <div id="game-root">
    <div id="header-area">
      <div id="timer" role="timer" aria-live="polite"><div class="fill"></div><div class="label">00:00</div></div>
      <button id="pauseBtn" aria-label="일시정지" title="일시정지"><img src="../asset/img/StopB.png" alt="pause"></button>
    </div>

    <div id="game-board" role="game-board" aria-label="Game Board">
      <div id="hud" class="hud" aria-hidden="true">node: -, -</div>

      <img id="scene-img" src="../asset/img/BathROOM_0000527.jpg" alt="scene background">
      <div id="board-overlay" aria-hidden="true"></div>
      <img id="soup_item" src="../asset/img/Comp_2_0000000.png" alt="soap item">

      <div id="dynamic-root" aria-hidden="true"></div>
    </div>

    <div id="direction-buttons" role="group">
      <img id="dpad-img" src="../asset/img/BAD.png" alt="dpad">
      <button id="up-btn" data-dir="UP" aria-label="위"></button>
      <button id="right-btn" data-dir="RIGHT" aria-label="오른쪽"></button>
      <button id="down-btn" data-dir="DOWN" aria-label="아래"></button>
      <button id="left-btn" data-dir="LEFT" aria-label="왼쪽"></button>
    </div>

  </div>

  <!-- modals -->
  <div id="countdownModal" class="countdown-modal" role="dialog" aria-modal="true" style="display:none">
    <div class="countdown-box">
      <div id="countNumber" class="count-number" aria-hidden="true">3</div>
      <div class="count-label">게임 시작까지</div>
    </div>
  </div>

  <div id="pauseModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="box">
      <h3>일시정지</h3>
      <div style="display:flex;gap:10px;margin-top:8px;justify-content:flex-end">
        <button id="resumeBtn">계속</button>
        <button id="restartBtn">다시시작</button>
      </div>
    </div>
  </div>

  <div id="gameOverModal" class="modal" role="dialog" aria-modal="true">
    <div class="box">
      <h2>게임 오버</h2>
      <p id="gameOverMsg">충돌했습니다.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <button id="goRestart">다시시작</button>
      </div>
    </div>
  </div>

  <!-- Scripts: keep order (utils first, obstacles, dynamic, core) -->
  <script src="../asset/js/soap_utils_shim.js"></script>
  <script src="../asset/js/soap_utils_patched.js"></script>
  <script src="../asset/js/soap_obstacles.js"></script>
  <script src="../asset/js/soap_dynamic.js"></script>
  <script src="../asset/js/soap_game_core.js"></script>
</body>
</html>
